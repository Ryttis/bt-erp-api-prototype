services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      ERP_ANALYTICS_API_TOKEN: "${ERP_ANALYTICS_API_TOKEN:?ERP_ANALYTICS_API_TOKEN is required}"
      ERP_REPLICA_HOST: "${ERP_REPLICA_HOST:?ERP_REPLICA_HOST is required}"
      ERP_REPLICA_PORT: "${ERP_REPLICA_PORT:-3306}"
      ERP_REPLICA_DATABASE: "${ERP_REPLICA_DATABASE:?ERP_REPLICA_DATABASE is required}"
      ERP_REPLICA_USER: "${ERP_REPLICA_USER:?ERP_REPLICA_USER is required}"
      ERP_REPLICA_PASSWORD: "${ERP_REPLICA_PASSWORD:?ERP_REPLICA_PASSWORD is required}"
      ERP_REPLICA_SSL: "${ERP_REPLICA_SSL:-false}"
      ERP_REPLICA_CONNECTION_LIMIT: "${ERP_REPLICA_CONNECTION_LIMIT:-4}"
      ERP_REPLICA_QUERY_TIMEOUT_MS: "${ERP_REPLICA_QUERY_TIMEOUT_MS:-30000}"
      ERP_ANALYTICS_CONCURRENCY: "${ERP_ANALYTICS_CONCURRENCY:-3}"
      ERP_ANALYTICS_QUEUE_LIMIT: "${ERP_ANALYTICS_QUEUE_LIMIT:-6}"
      ERP_ANALYTICS_QUEUE_TIMEOUT_MS: "${ERP_ANALYTICS_QUEUE_TIMEOUT_MS:-1000}"
      ERP_SLOW_QUERY_MS: "${ERP_SLOW_QUERY_MS:-1000}"
      MAX_REQUEST_URL_LENGTH: "${MAX_REQUEST_URL_LENGTH:-4096}"
      ERP_FIXED_COST_TRUCK_SUMMARY_PILOT_ENABLED: "${ERP_FIXED_COST_TRUCK_SUMMARY_PILOT_ENABLED:-false}"
      ERP_FIXED_COST_TRAILER_PILOT_ENABLED: "${ERP_FIXED_COST_TRAILER_PILOT_ENABLED:-false}"
